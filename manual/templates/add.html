<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viết lời nhắn – Sổ lưu bút</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">✎</span>Sổ lưu bút</a>
        <nav>
            <a href="{{ url_for('index') }}">Lời nhắn</a>
            <a href="{{ url_for('stats') }}">Thống kê</a>
            <a class="button button-primary button-small active" href="{{ url_for('add') }}">Viết lời nhắn</a>
        </nav>
    </header>

    <main class="container narrow">
        <a class="back-link" href="{{ url_for('index') }}">← Quay lại danh sách</a>
        <section class="card form-card">
            <h1>Viết lời nhắn</h1>
            <p class="lead">Đôi lời của bạn sẽ xuất hiện trong sổ lưu bút.</p>

            {% if error %}
            <p class="error-message">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('add') }}" method="post" class="entry-form">
                <p>
                    <label for="name">Tên của bạn</label>
                    <input type="text" id="name" name="name" maxlength="100"
                           placeholder="Ví dụ: Nguyễn Văn A" value="{{ name }}" autofocus>
                </p>
                <p>
                    <label for="message">Lời nhắn</label>
                    <textarea id="message" name="message" rows="5"
                              placeholder="Viết điều bạn muốn nhắn gửi...">{{ message }}</textarea>
                </p>
                <div class="form-actions">
                    <a class="button button-ghost" href="{{ url_for('index') }}">Hủy</a>
                    <button class="button button-primary" type="submit">Gửi lời nhắn</button>
                </div>
            </form>
        </section>
    </main>

    <footer>PyGuestbook · Bài tập nhóm Lập trình web với Python</footer>
</body>
</html>
